name: Bug report
description: Something in the recorder extension, the Python toolkit or the tooling does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste raw traces, typed text, screenshots of
        private pages, credentials or participant information.** Security or privacy
        problems go through [private vulnerability reporting](https://github.com/appleweiping/ComputerUseAgent/security/advisories/new) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Chrome extension (recorder)
        - Python package / computer-use-agent CLI
        - Trace viewer
        - Detector pipeline
        - X11 capture
        - Research harness (research/)
        - CI / tooling / docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`computer-use-agent --version`, the extension version on chrome://extensions, or the commit SHA."
      placeholder: "0.5.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version and Chrome version, as relevant.
      placeholder: "Windows 11, Python 3.12.13, Node 22.21.1, Chrome 151"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or clicks that shows the problem. Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error message or log output (redact paths and identifiers).
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no raw traces, typed text, credentials or participant information.
          required: true
