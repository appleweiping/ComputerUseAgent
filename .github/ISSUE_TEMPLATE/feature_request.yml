name: Feature request
description: Propose a new capability or a change to existing behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: Tick everything the change would touch.
      options:
        - label: Changes what the recorder captures or stores (privacy impact)
        - label: Changes a wire format (`cui-trace-v2`, detector dataset or analysis schemas)
        - label: Changes the public Python API or the `computer-use-agent` CLI
        - label: Adds a runtime dependency or an extension permission
