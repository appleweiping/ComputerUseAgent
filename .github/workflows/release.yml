name: Release

# Pushing a tag vX.Y.Z builds every release asset, attests its provenance and
# opens a DRAFT GitHub Release for a maintainer to review and publish.
# workflow_dispatch (from any branch or tag) is a dry run: it builds and uploads
# the same assets as a workflow artifact but creates no attestation, release or
# upload. The side-effecting jobs are gated on the push event as well as the ref
# type, because a manual run started from a tag also has ref_type == 'tag'.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  UV_VERSION: "0.11.21"
  NODE_VERSION: "22"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          activate-environment: true
          # Release assets are built from a cold uv cache (and no CI job's cache
          # key would match this one anyway).
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install release tooling from uv.lock
        run: uv sync --locked --no-default-groups --group dev

      - name: Tag == pyproject == manifest == package.json == CITATION
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python tools/ci/check_versions.py --tag "${GITHUB_REF_NAME}"
          else
            python tools/ci/check_versions.py
          fi
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: twine check
        run: twine check --strict dist/*.whl dist/*.tar.gz

      - name: Package the extension ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm --prefix extension ci --no-audit --no-fund
          npm --prefix extension run package
          test -f "dist/computer-use-agent-recorder-${VERSION}.zip"

      - name: CycloneDX SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/ci/supply_chain.py --write --sbom-output "dist/computer-use-agent-${VERSION}.cdx.json"

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.whl *.tar.gz *.zip *.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Attest and draft the GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          {
            echo
            echo "Verify downloads with \`sha256sum --check SHA256SUMS\` and"
            echo "\`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
          } >> "${RUNNER_TEMP}/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft --verify-tag \
            --title "ComputerUseAgent ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist/*

  pypi:
    name: Publish to PyPI (disabled unless vars.PUBLISH_TO_PYPI == 'true')
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag'
      && vars.PUBLISH_TO_PYPI == 'true'
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/computer-use-agent/
    permissions:
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Keep only the wheel and sdist
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
